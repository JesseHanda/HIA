site:
  name: CHALLO Kids Club
  # Update to your custom domain when you add one
  site: 'https://hia-two.vercel.app'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: CHALLO Kids Club — Character Enrichment Program for Grades 1–3
    template: '%s — CHALLO Kids Club'
  description: CHALLO Kids Club is an eight-week character enrichment program for children in Grades 1–3. Through stories, conversations and hands-on activities, children practise gratitude, kindness, empathy, friendship, respect, courage and helping others.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: CHALLO Kids Club
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
