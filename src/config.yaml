site:
  name: Hearts in Action
  # TODO: replace with your Cloudflare Pages URL or custom domain
  site: 'https://heartsinaction.pages.dev'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: Hearts in Action — 8-Week Character Program for Grades 1–3
    template: '%s — Hearts in Action'
  description: An 8-week character enrichment program for Grades 1–3 in Burlington, Ontario. Small groups of up to 15 children explore gratitude, kindness, empathy and courage through stories, hands-on activities and a growing garden.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Hearts in Action
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
